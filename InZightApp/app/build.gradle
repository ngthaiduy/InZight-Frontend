plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.example.inzightapp'
    compileSdk 35

    defaultConfig {
        applicationId "com.example.inzightapp"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }


    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
    buildFeatures {
        viewBinding true
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.constraintlayout
    implementation libs.navigation.fragment
    implementation libs.navigation.ui
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core
    // Retrofit
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'

    // OkHttp (nếu cần log request/response)
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'com.google.android.material:material:1.12.0'

    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'

    implementation 'de.hdodenhof:circleimageview:3.1.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.11.0'



// Kotlin KTX (Nếu bạn muốn dùng AndroidX KTX)
    implementation 'androidx.core:core-ktx:1.9.0' // Hoặc phiên bản mới nhất

// Fragment (Nếu bạn dùng Fragment)
    implementation 'androidx.appcompat:appcompat:1.6.1'

    implementation "androidx.appcompat:appcompat:1.7.0"
    implementation "com.google.android.material:material:1.12.0"
    implementation "androidx.constraintlayout:constraintlayout:2.2.0"
    implementation "androidx.recyclerview:recyclerview:1.3.2"
    implementation "androidx.viewpager2:viewpager2:1.1.0"

    // WebSocket STOMP client cho chat realtime
    implementation 'com.github.NaikSoftware:StompProtocolAndroid:1.6.6'
    // Bổ sung RxJava/RxAndroid để có các API subscribe() cho Flowable/Completable
    implementation 'io.reactivex.rxjava2:rxjava:2.2.21'
    implementation 'io.reactivex.rxjava2:rxandroid:2.1.1'
    // Annotation support (Nullable/NonNull, etc.)
    implementation 'androidx.annotation:annotation:1.7.1'
    
    // CameraX cho camera và quét QR
    def camerax_version = "1.3.0"
    implementation "androidx.camera:camera-core:${camerax_version}"
    implementation "androidx.camera:camera-camera2:${camerax_version}"
    implementation "androidx.camera:camera-lifecycle:${camerax_version}"
    implementation "androidx.camera:camera-view:${camerax_version}"
    
    // ML Kit Barcode Scanning (QR code)
    implementation 'com.google.mlkit:barcode-scanning:17.2.0'
    
    // ML Kit Text Recognition (OCR cho hóa đơn)
    implementation 'com.google.android.gms:play-services-mlkit-text-recognition:19.0.0'
    
    // ZXing cho QR code (backup option)
    implementation 'com.journeyapps:zxing-android-embedded:4.3.0'
    
    // Image picker
    implementation 'androidx.activity:activity:1.8.2'

}